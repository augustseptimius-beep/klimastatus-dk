name: Deploy to Production

on:
  push:
    branches: [main]
    # Byg/deploy IKKE når kun dokumentation ændres — sparer en unødig
    # Docker-build + redeploy. Hvis en commit rører både docs OG kode,
    # kører workflowen alligevel (paths-ignore springer kun over når ALLE
    # ændrede filer matcher).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Kør typecheck/test/lint på pull requests, så fejl fanges FØR merge —
  # build/deploy-jobs er gated til push (se `if` nedenfor).
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-placeholder-secret-min-32-chars-long-xxxx
          SKIP_DB_VALIDATION: 'true'

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

  build-and-push:
    needs: check
    # Kun på push til main — PRs skal ikke bygge/pushe images
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Trigger Coolify til at hente det nyligt byggede image (build-and-push
    # ovenfor) og redeploye. Coolify kører pull-and-run — der bygges IKKE på
    # serveren (det gav OOM). Migrationer kører ved container-opstart.
    #
    # Aktivér ved at sætte:
    #   - repository-variabel DEPLOY_ENABLED=true
    #     (Settings → Secrets and variables → Actions → Variables)
    #   - secret COOLIFY_TOKEN = en Coolify API-token
    #     (Coolify → Keys & Tokens → API tokens)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl --fail-with-body -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "http://179.237.70.167:8000/api/v1/deploy?uuid=ku89p74dfsc9n3nmgklr6ox3&force=true"
